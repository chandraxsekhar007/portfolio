<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0a0000"/>
    </linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Scanlines -->
  <rect width="1200" height="630" fill="url(#rg)" opacity="0.4"/>

  <!-- Scan lines effect -->
  <rect width="1200" height="1" y="0" fill="rgba(255,0,0,0.03)" opacity="0.5"/>
  <rect width="1200" height="630" fill="none" stroke="rgba(255,0,0,0.06)" stroke-width="1"
        style="stroke-dasharray: 0 4; stroke-dashoffset: 0"/>

  <!-- Red accent line left -->
  <rect x="72" y="80" width="2" height="470" fill="#ff0000" opacity="0.4"/>

  <!-- Top tag -->
  <text x="92" y="112" font-family="'Courier New', monospace" font-size="14"
        fill="rgba(255,0,0,0.5)" letter-spacing="6">// CYBERSECURITY PORTFOLIO</text>

  <!-- Main name -->
  <text x="88" y="240" font-family="'Courier New', monospace" font-size="96"
        fill="#ffffff" letter-spacing="8" filter="url(#glow)"
        style="text-shadow: 4px 0 rgba(255,0,0,0.4)">fsociety</text>

  <!-- Red glitch layer -->
  <text x="91" y="240" font-family="'Courier New', monospace" font-size="96"
        fill="rgba(255,0,0,0.25)" letter-spacing="8">fsociety</text>
  <text x="85" y="240" font-family="'Courier New', monospace" font-size="96"
        fill="rgba(0,85,255,0.18)" letter-spacing="8">fsociety</text>

  <!-- Subtitle -->
  <text x="92" y="300" font-family="'Courier New', monospace" font-size="18"
        fill="rgba(255,255,255,0.25)" letter-spacing="5">PENETRATION TESTER &amp; CTF PLAYER</text>

  <!-- Divider -->
  <rect x="88" y="330" width="400" height="1" fill="rgba(255,0,0,0.25)"/>

  <!-- Stats row -->
  <text x="92" y="372" font-family="'Courier New', monospace" font-size="15"
        fill="rgba(0,255,65,0.7)" letter-spacing="3">TOP 5% TRYHACKME</text>
  <text x="92" y="400" font-family="'Courier New', monospace" font-size="15"
        fill="rgba(0,255,65,0.5)" letter-spacing="3">400+ CTF CHALLENGES</text>
  <text x="92" y="428" font-family="'Courier New', monospace" font-size="15"
        fill="rgba(0,255,65,0.5)" letter-spacing="3">4 SECURITY TOOLS BUILT</text>

  <!-- Quote -->
  <text x="92" y="510" font-family="'Courier New', monospace" font-size="19"
        fill="rgba(255,0,0,0.45)" font-style="italic" letter-spacing="1">
    "I don't just want a job. I want to change things."
  </text>

  <!-- Domain placeholder -->
  <text x="92" y="566" font-family="'Courier New', monospace" font-size="14"
        fill="rgba(255,255,255,0.18)" letter-spacing="4">yourdomain.com</text>

  <!-- Corner decoration -->
  <rect x="1100" y="50" width="1" height="530" fill="rgba(255,0,0,0.12)"/>
  <text x="1116" y="340" font-family="'Courier New', monospace" font-size="12"
        fill="rgba(255,0,0,0.2)" letter-spacing="3"
        transform="rotate(90,1116,340)">ANONYMOUS // 2025</text>
</svg>
